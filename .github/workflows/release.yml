name: release

# Publishes the package to NPM. Two triggers:
#   * workflow_dispatch — manual button on the Actions page. Use this
#     for the initial v1.0.0 release (the tag already exists) or any
#     time you want to republish from main HEAD without cutting a new
#     tag.
#   * push: tags: ['v*'] — automatic publish when a vX.Y.Z tag lands
#     on origin. This is the long-term flow: `git tag v1.0.1 && git
#     push origin v1.0.1` triggers publish.
#
# The workflow re-runs the full quality gate (`npm run check`) before
# publishing so a stale `main` can't ship if it slipped post-tag.
#
# Auth: NPM Trusted Publishing (OIDC). No long-lived NPM_TOKEN
# required — the workflow exchanges a GitHub OIDC token for a
# short-lived NPM auth token at publish time. Configure the
# trusted publisher once on npmjs.com under the package's
# (or user's) "Trusted Publishers" settings page:
#   organization: ejosterberg
#   repository:   opensalestax-saleor
#   workflow:     release.yml
#   environment:  (leave empty)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing + provenance

jobs:
  publish:
    name: publish to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing needs npm >= 11.5. Node 22 ships a recent
      # npm, but bump explicitly so the runner image's version doesn't
      # silently regress us.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (lint + typecheck + tests + audit)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Publish (trusted publishing + provenance)
        run: npm publish --access public --provenance
