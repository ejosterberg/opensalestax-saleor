name: release

# Publishes the package to NPM. Two triggers:
#   * workflow_dispatch — manual button on the Actions page. Use this
#     for the initial v1.0.0 release (the tag already exists) or any
#     time you want to republish from main HEAD without cutting a new
#     tag.
#   * push: tags: ['v*'] — automatic publish when a vX.Y.Z tag lands
#     on origin. This is the long-term flow: `git tag v1.0.1 && git
#     push origin v1.0.1` triggers publish.
#
# The workflow re-runs the full quality gate (`npm run check`) before
# publishing so a stale `main` can't ship if it slipped post-tag.
#
# Auth: NPM Trusted Publishing (OIDC). No long-lived NPM_TOKEN
# required — the workflow exchanges a GitHub OIDC token for a
# short-lived NPM auth token at publish time. Configure the
# trusted publisher once on npmjs.com under the package's
# (or user's) "Trusted Publishers" settings page:
#   organization: ejosterberg
#   repository:   opensalestax-saleor
#   workflow:     release.yml
#   environment:  (leave empty)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing + provenance

jobs:
  publish:
    name: publish to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Binds this job to the `npm-publish` GitHub Environment.
    # Trusted Publishing validates the OIDC token's `environment`
    # claim against the value configured on the NPM trusted-publisher
    # entry. Both must match (here: "npm-publish"; on npmjs.com:
    # set "Environment name" to "npm-publish" on the package's
    # Trusted Publisher).
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (lint + typecheck + tests + audit)
        run: npm run check

      - name: Build
        run: npm run build

      # Diagnostic block requested by NPM support — captures the
      # registry config + ping + npm version that's actually
      # running, so support can validate what we're presenting.
      - name: Diagnostic — runtime env
        run: |
          echo "=== node + npm versions ==="
          node --version
          npm --version
          echo "=== npm registry config ==="
          npm config get registry
          echo "=== npm full config ==="
          npm config list -l 2>&1 | grep -v "_authToken\|password\|secret" || true
          echo "=== npm ping ==="
          npm ping --registry=https://registry.npmjs.org
          echo "=== package.json head ==="
          head -n 60 package.json
          echo "=== current published version ==="
          npm view @ejosterberg/saleor-app-opensalestax name version --registry=https://registry.npmjs.org || true

      - name: Publish (trusted publishing + provenance, verbose)
        run: npm publish --tag latest --access public --provenance --loglevel verbose
