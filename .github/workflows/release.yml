name: release

# Publishes the package to NPM. Two triggers:
#   * workflow_dispatch — manual button on the Actions page. Use this
#     for the initial v1.0.0 release (the tag already exists) or any
#     time you want to republish from main HEAD without cutting a new
#     tag.
#   * push: tags: ['v*'] — automatic publish when a vX.Y.Z tag lands
#     on origin. This is the long-term flow: `git tag v1.0.1 && git
#     push origin v1.0.1` triggers publish.
#
# The workflow re-runs the full quality gate (`npm run check`) before
# publishing so a stale `main` can't ship if it slipped post-tag.
#
# Auth: NPM Trusted Publishing (OIDC). No long-lived NPM_TOKEN
# required — the workflow exchanges a GitHub OIDC token for a
# short-lived NPM auth token at publish time. Configure the
# trusted publisher once on npmjs.com under the package's
# (or user's) "Trusted Publishers" settings page:
#   organization: ejosterberg
#   repository:   opensalestax-saleor
#   workflow:     release.yml
#   environment:  (leave empty)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing + provenance

jobs:
  publish:
    name: publish to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing needs npm >= 11.5. Node 22.22+ ships
      # npm 11.7+ in its toolcache image; no explicit upgrade
      # needed (and `npm install -g npm@latest` from within itself
      # is unreliable — it hit MODULE_NOT_FOUND in the v1.0.1 run).
      - name: Check npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (lint + typecheck + tests + audit)
        run: npm run check

      - name: Build
        run: npm run build

      # TEMP diagnostic — print the OIDC claims that GitHub Actions
      # will send to NPM for Trusted Publishing. Compare against the
      # trusted publisher config on npmjs.com. Remove this step once
      # publishing works.
      - name: Debug — print OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('npm');
            const [, payload] = token.split('.');
            const claims = JSON.parse(Buffer.from(payload, 'base64url').toString());
            // strip noise but keep everything NPM uses for matching
            const interesting = {
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              repository_owner: claims.repository_owner,
              repository_owner_id: claims.repository_owner_id,
              workflow: claims.workflow,
              workflow_ref: claims.workflow_ref,
              workflow_sha: claims.workflow_sha,
              job_workflow_ref: claims.job_workflow_ref,
              job_workflow_sha: claims.job_workflow_sha,
              event_name: claims.event_name,
              ref: claims.ref,
              ref_type: claims.ref_type,
              environment: claims.environment ?? '(empty)',
              actor: claims.actor,
              runner_environment: claims.runner_environment,
            };
            core.info('OIDC claims sent to NPM (audience=npm):');
            core.info(JSON.stringify(interesting, null, 2));

      - name: Publish (trusted publishing + provenance)
        run: npm publish --access public --provenance
