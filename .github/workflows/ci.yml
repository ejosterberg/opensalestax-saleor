name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Validate the supported Node range:
        #   20 — package.json `engines.node` floor
        #   22 — current LTS
        #   24 — newest LTS (matches the release workflow's runner)
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests (with coverage)
        run: npm test -- --coverage --ci
      - name: Audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Upload coverage
        # Only upload from one matrix job — the lcov.info is identical
        # across runners, no value in three uploads.
        if: matrix.node == '20'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
